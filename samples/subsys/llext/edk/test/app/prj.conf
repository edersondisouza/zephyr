CONFIG_ZTEST=y

CONFIG_APPLICATION_DEFINED_SYSCALL=y
CONFIG_USERSPACE=y
CONFIG_LLEXT=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

# The bindings allocate their kernel objects and stacks at runtime, because a
# dynamically loaded userspace extension cannot use statically defined ones.
CONFIG_DYNAMIC_OBJECTS=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

CONFIG_EVENTS=y
CONFIG_THREAD_MONITOR=y

CONFIG_LLEXT_HEAP_SIZE=32

CONFIG_PICOLIBC_USE_MODULE=y
CONFIG_LLEXT_EXPORT_DEVICES=y
